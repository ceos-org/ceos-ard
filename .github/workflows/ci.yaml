name: CI
on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'glossary/**'
      - 'pfs/**'
      - 'references/**'
      - 'requirements/**'
      - 'sections/**'
      # an override of the built-in templates
      - 'templates/**'
      # the version of the CLI
      - 'requirements.txt'
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
    paths:
      - 'assets/**'
      - 'glossary/**'
      - 'pfs/**'
      - 'references/**'
      - 'requirements/**'
      - 'sections/**'
      # an override of the built-in templates
      - 'templates/**'
      # the version of the CLI
      - 'requirements.txt'
permissions:
  contents: read
concurrency:
  # A new build of a pull request or branch cancels the running one, so that a build without the document history
  # can't finish last and replace the preview; other labels get a group of their own, as they don't build anything
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'document history'
    && format('ci-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
env:
  # The document history needs the GitHub token, so pull requests only get it when a member adds this label,
  # once for the commits at that time; new commits need the label to be added again
  HISTORY: ${{ github.event_name == 'push' || github.event.label.name == 'document history' }}
jobs:
  validate:
    # other labels don't change the documents
    if: github.event.action != 'labeled' || github.event.label.name == 'document history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the following steps run code of the pull request, which doesn't need the token
          persist-credentials: false
      - uses: ceos-org/ceos-ard-cli@v0.8.0
        with:
          requirements-file: requirements.txt
          browser: false
      - name: Run validation
        run: ceos-ard validate
  generate:
    # run once, see https://github.com/orgs/community/discussions/57827
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          # the full history is required to assign the changes to the releases
          fetch-depth: 0
          # the following steps run code of the pull request, which doesn't need the token
          persist-credentials: false
      - uses: ceos-org/ceos-ard-cli@v0.8.0
        with:
          requirements-file: requirements.txt
      - name: Generate all PFS
        if: env.HISTORY != 'true'
        run: ceos-ard generate-all -o build --self-contained
      - name: Generate all PFS with the document history
        if: env.HISTORY == 'true'
        env:
          # used to retrieve the releases for the document history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ceos-ard generate-all -o build --self-contained --history
      - name: Archive generated PFS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documents
          path: build
  deploy-latest:
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: write
    steps:
      - name: Download PFS artifacts
        uses: actions/download-artifact@v8
        with:
          name: documents
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: documents/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documents
          destination_dir: latest
          commit_message: Deploy latest version of PFS documents
          exclude_assets: '{assets/**,*.{md,bib}}'
