name: CI
on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'glossary/**'
      - 'pfs/**'
      - 'references/**'
      - 'requirements/**'
      - 'sections/**'
      # an override of the built-in templates
      - 'templates/**'
      # the version of the CLI
      - 'requirements.txt'
      # the workflow itself
      - '.github/workflows/ci.yaml'
  pull_request:
    paths:
      - 'assets/**'
      - 'glossary/**'
      - 'pfs/**'
      - 'references/**'
      - 'requirements/**'
      - 'sections/**'
      # an override of the built-in templates
      - 'templates/**'
      # the version of the CLI
      - 'requirements.txt'
      # the workflow itself
      - '.github/workflows/ci.yaml'
permissions:
  contents: read
concurrency:
  # A new build of a pull request or branch cancels the running one
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the following steps run code of the pull request, which doesn't need the token
          persist-credentials: false
      - uses: ceos-org/ceos-ard-cli@v0.8.0
        with:
          requirements-file: requirements.txt
          browser: false
      - name: Run validation
        run: ceos-ard validate
  generate:
    # run once, see https://github.com/orgs/community/discussions/57827
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          # the full history and the tags are required to assign the changes to the releases
          fetch-depth: 0
          # the following steps run code of the pull request, which doesn't need the token
          persist-credentials: false
      - uses: ceos-org/ceos-ard-cli@v0.8.0
        with:
          requirements-file: requirements.txt
      - name: Generate all PFS
        # --offline reads the releases from the git tags, so pull requests need no token for the document history
        run: ceos-ard generate-all -o build --self-contained --history --offline
      - name: Archive generated PFS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documents
          path: build
  deploy-latest:
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      contents: write
    steps:
      - name: Download PFS artifacts
        uses: actions/download-artifact@v8
        with:
          name: documents
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: documents/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documents
          destination_dir: latest
          commit_message: Deploy latest version of PFS documents
          exclude_assets: '{assets/**,*.{md,bib}}'
