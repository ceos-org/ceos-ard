name: Deploy PR preview
# Runs in the base repository with access to secrets, triggered after CI has
# built the artifacts in the unprivileged pull_request context. It must never
# check out or execute code from the pull request.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  actions: read
  pull-requests: write
jobs:
  deploy-pr:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Fork PRs are missing from workflow_run.pull_requests, so resolve the
      # PR number from the head commit instead
      - name: Find pull request for this run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            const pr = prs.find(pr => pr.state === 'open') ?? prs[0];
            if (!pr) {
              core.setFailed(`No pull request found for commit ${context.payload.workflow_run.head_sha}`);
              return;
            }
            core.setOutput('number', pr.number);
      - name: Download PFS artifacts
        uses: actions/download-artifact@v4
        with:
          name: documents
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: documents/
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.previews.ceos-ard.moregeo.it
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: documents/
          server-dir: pr-${{ steps.pr.outputs.number }}/
          exclude: '{assets/**,*.{md,bib}}'
          dangerous-clean-slate: true
      - name: Add comment to pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequestNumber = ${{ steps.pr.outputs.number }};
            const start = '⚠️';
            const author = 'github-actions[bot]';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber
            });

            const commentExists = comments.data.some(
              comment => comment.user.login === author && comment.body.startsWith(start)
            );

            if (!commentExists) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequestNumber,
                body: `${start} A preview for all PFS has been generated and can be accessed here: <https://previews.ceos-ard.moregeo.it/pr-${pullRequestNumber}/>`
              });
            } else {
              console.log(`Preview URL comment already added to PR #${pullRequestNumber}`);
            }
