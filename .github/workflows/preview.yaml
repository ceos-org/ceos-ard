name: Deploy PR preview
# Runs in the base repository with access to secrets, triggered after CI has
# built the artifacts in the unprivileged pull_request context. It must never
# check out or execute code from the pull request.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  actions: read
  pull-requests: write
jobs:
  # Without a concurrency group, so that runs without documents never take the place of a waiting deployment
  check:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.artifacts.outputs.found }}
    steps:
      # A run for a label other than `document history` skips all jobs, so it succeeds without any documents
      - name: Check that the run generated the newest documents
        id: artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const hasDocuments = async id => {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: id,
              });
              return artifacts.some(artifact => artifact.name === 'documents');
            };
            let found = await hasDocuments(run.id);
            if (found) {
              // The concurrency queue doesn't guarantee the order, so a newer build of the same commit wins,
              // e.g. the one with the document history over the one without
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: run.workflow_id,
                head_sha: run.head_sha,
                status: 'success',
              });
              for (const other of runs) {
                if (new Date(other.created_at) > new Date(run.created_at) && await hasDocuments(other.id)) {
                  core.info(`Not deployed, the newer run ${other.id} generated the documents of this commit`);
                  found = false;
                  break;
                }
              }
            }
            core.setOutput('found', found);
  deploy-pr:
    needs: check
    if: needs.check.outputs.found == 'true'
    # One deployment per pull request at a time; GitHub keeps only the newest waiting one
    concurrency:
      group: preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Fork PRs are missing from workflow_run.pull_requests and are not
      # returned by listPullRequestsAssociatedWithCommit on the base repo, so
      # match the head commit against the open PRs instead. The number comes
      # from the GitHub API, never from PR-controlled data.
      - name: Find pull request for this run
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const pr = prs.find(pr => pr.head.sha === context.payload.workflow_run.head_sha);
            if (!pr) {
              // The commit was replaced by a newer one, or the pull request was closed
              core.info(`Not deployed, no open pull request has the commit ${context.payload.workflow_run.head_sha}`);
              return;
            }
            core.setOutput('number', pr.number);
      - name: Download PFS artifacts
        if: steps.pr.outputs.number
        uses: actions/download-artifact@v4
        with:
          name: documents
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: documents/
      - name: Deploy via FTP
        if: steps.pr.outputs.number
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.previews.ceos-ard.moregeo.it
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: documents/
          server-dir: pr-${{ steps.pr.outputs.number }}/
          exclude: '{assets/**,*.{md,bib}}'
          dangerous-clean-slate: true
      - name: Add comment to pull request
        if: steps.pr.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequestNumber = ${{ steps.pr.outputs.number }};
            const start = '⚠️';
            const author = 'github-actions[bot]';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber
            });

            const commentExists = comments.data.some(
              comment => comment.user.login === author && comment.body.startsWith(start)
            );

            if (!commentExists) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequestNumber,
                body: `${start} A preview for all PFS has been generated and can be accessed here: <https://previews.ceos-ard.moregeo.it/pr-${pullRequestNumber}/>`
              });
            } else {
              console.log(`Preview URL comment already added to PR #${pullRequestNumber}`);
            }
