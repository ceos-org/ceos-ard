name: Check changes
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited
    paths:
      - 'glossary/**'
      - 'pfs/**'
      - 'requirements/**'
      - 'sections/**'
      # the version of the CLI
      - 'requirements.txt'
      # the workflow itself
      - '.github/workflows/check-changes.yaml'
permissions:
  contents: read
jobs:
  check-changes:
    # Ensure that all changed building blocks have a new changelog entry, can be skipped with the label "no changelog"
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history is required to compare against the base branch
          fetch-depth: 0
          # the following steps run code of the pull request, which doesn't need the token
          persist-credentials: false
      - uses: ceos-org/ceos-ard-cli@v0.8.0
        with:
          requirements-file: requirements.txt
          browser: false
      - name: Check changelog entries
        run: ceos-ard check-changes --base origin/${{ github.base_ref }}
