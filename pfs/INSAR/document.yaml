requirements:
  - category: general-metadata
    requirements:
      - metadata/traceability-sar
      - metadata/machine-readability-sar
      - metadata/product-type
      - metadata/pfs-url
      - metadata/time-sar
  - category: source-metadata
    requirements:
      - metadata/acquisition-id
      - metadata/data-access-source
      - metadata/instrument-sar
      - metadata/time-source
      - metadata/acquisition-parameters-sar
      - metadata/orbit-insar
      - metadata/processing-parameters
      - metadata/image-attributes-sar
      - metadata/sensor-calibration-sar
      - metadata/performance-indicators
      - metadata/polarimetric-calibration-matrices
      - metadata/mean-faraday-rotation-angle
      - metadata/ionosphere-indicator
  - category: product-metadata
    requirements:
      - metadata/data-access-product
      - metadata/auxiliary-data-sar
      - metadata/sample-spacing
      - metadata/enl
      - metadata/resolution
      - metadata/geo-bbox
      - metadata/geo-area-sar
      - metadata/image-size
      - metadata/pixel-coordinate-convention
      - metadata/crs-sar
      - metadata/radar-unit-look-vector
      - metadata/insar-pair
      - metadata/insar-pair-coregistration
      - metadata/insar-phase-quality
      - metadata/filtering-interferogram
      - metadata/phase-unwrapping
      - corrections/atmospheric-phase
      - corrections/ionospheric-phase
      - metadata/displacement-modelling
  - category: per-pixel-metadata
    requirements:
      - metadata/machine-readability-sar
      - ref: per-pixel/data-mask
        append:
          requirements:
            goal:
              description: |-
                - Unwrapped interferogram phase quality flag/score
      - per-pixel/scattering-area
      - ref: per-pixel/ellipsoidal-incident-angle
        append:
          requirements:
            image:
              description: |-
                Required when a Radar Unit Look Vector Grid Image (see @radar-unit-look-vector-grid) is not provided.
          dependencies:
            radar-unit-look-vector-grid: per-pixel/radar-unit-look-vector-grid-insar
      - per-pixel/noise-power
      - per-pixel/gamma-sigma-ratio
      - per-pixel/dem
      - per-pixel/radar-unit-look-vector-grid-insar
      - per-pixel/slant-range-insar
      - ref: per-pixel/insar-phase-uncertainty
        append:
          requirements:
            goal:
              description: |-
                -	insarID number (see [@insarID])
                -	Corresponding interferogram
          dependencies:
            insarID: metadata/insar-pair
      - ref: per-pixel/atmospheric-phase-correction
        append:
          requirements:
            goal:
              description: |-
                -	insarID number (see [@insarID])
          dependencies:
            insarID: metadata/insar-pair
      - ref: per-pixel/ionospheric-phase-correction
        append:
          requirements:
            goal:
              description: |-
                -	insarID number (see [@insarID])
          dependencies:
            insarID: metadata/insar-pair
      - per-pixel/simulated-topographic-phase
      - per-pixel/insar-perpendicular-baseline
      - per-pixel/insar-parallel-baseline
      - per-pixel/insar-displacement-model-point
  - category: radiometrically-corrected-measurements
    requirements:
      - measurements/backscatter-insar
      - measurements/scaling-conversion
      - metadata/noise-removal
      - corrections/radiometric-terrain-algorithm-minimal
      - metadata/radiometric-accuracy-sar
      - measurements/coherence-image
      - measurements/interferogram-image
      - measurements/interferogram-image-unwrapped
      - measurements/insar-displacement-image
      - measurements/insar-displacement-residue-image
      - measurements/insar-displacement-rate-image
      - measurements/insar-displacement-rate-model-fit-image
  - category: geometric-corrections
    requirements:
      - metadata/geometric-correction-algorithm
      - corrections/dem
      - ref: corrections/geometric-accuracy-sar
        append:
          requirements:
            goal:
              description: |-
                Specify the SAR acquisition used for geocoding. SAR acquisition could be different from the two source acquisitions of the product when a stack of acquisitions is processed simultaneously.
      - corrections/geometric-refined-accuracy
      - corrections/gridding-convention

