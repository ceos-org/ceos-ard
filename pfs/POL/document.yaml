    requirements:
      - metadata/data-access-product
      - metadata/auxiliary-data-sar
      - metadata/sample-spacing
      - metadata/enl
      - metadata/resolution
      # todo: filtering-speckle-pol should be just be filtering-speckle and instead add filtering-pol
