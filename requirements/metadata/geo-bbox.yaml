id: geobbox
title: Product Bounding Box
description: 
requirements:
  threshold:
    description: |-
      At least two opposite corners of the product file (bounding box, including any zero-fill values) shall be provided,
      expressed in the coordinate reference system defined in [@crs].

      The bounding box shall be provided in a clear and unambiguous format, which may include 
      floating-point coordinate values (e.g., corner coordinates) or a well-known text (WKT) polygon string.
      
      Additional points may be provided to better represent the bounding box geometry.

      Four corners of the product file are recommended for scenes crossing the Antemeridian, or the North or the South Pole.
dependencies:
  crs: metadata/crs-sar
glossary:
references:
changes:
history:
  - SAR 1.7.7
remarks: |-
  Remove product data mentions (or replace with measurement) to be reusable in other products.
