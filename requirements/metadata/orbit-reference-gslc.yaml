id: reorbit-gslc
title: Reference Orbit 
description: |-
    **Usage: When a reference orbit is used instead of a virtual orbit (see [@topographic-phase-removal]).**
requirements:
  goal:
    description: |-
      Provide the absolute orbit number used as reference for topographic phase flattening.
      In case a virtual orbit has been used, provide orbit parameters or orbit state vectors as DOI or URL.
    optional: true
dependencies:
