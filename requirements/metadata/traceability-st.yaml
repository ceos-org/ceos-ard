id: trace-st
title: Metrological Traceability of the Measurand to SI
description:
requirements:
  goal:
    description: |-
      Data must be traceable to SI reference standard, documented by URL or DOI.
    notes:
      - SI Traceability requires an estimate of measurement uncertainty (see [@uncertainty]).
    optional: true
dependencies: 
  uncertainty: measurements/uncertainty-st
glossary:
  - doi
  - si
references:
