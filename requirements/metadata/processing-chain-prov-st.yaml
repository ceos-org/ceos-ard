id: proprov-st
title: Processing Chain Provenance
description: 
requirements:
  threshold:
    description: |-
     The provider attaches to each delivered dataset (delivery unit) information which allows the provider to reconstruct the exact processing environment (software versions, calibration files, parameter settings) in which this particular output was produced.
  goal:
    description: |-
      As threshold, but the provider is required to reproduce the exact same output.
    optional: true
dependencies:
glossary:
references:
changes:
  - date: 2026-08-27
    author: Harvey Jones
    level: major
    change: |-
      introduced a threshold requirement requiring reconstructibility at Threshold and reworded the Goal requirement for reproducibility.
    reason: Addresses GitHub issue 58, calling for processing chain provenance to become a threshold requirement
history:
