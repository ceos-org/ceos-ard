id: imgatt-sar
title: Source Data Image Attributes
description: 
requirements:
  threshold:
    description: |-
      Image attributes related to the source data:

      - Source data geometry (slant range/ground range/geocoded)
      - Azimuth pixel spacing \[m] (alternatively, azimuth pixel spacing can be provided in second \[s], equivalent to the azimuth time sample interval)
      - Range pixel spacing
      - Azimuth resolution
      - Range resolution 
      - Near range incident angle
      - Far range incident angle
    notes:
      - For geocoded sources such as GSLC and InSAR, Azimuth and Range pixel spacing are replaced by line (row) and pixel (column) spacing information. Spatial resolution information is not required for geocoded sources.
  goal:
    description: |-
      Geometry of the image footprint expressed in WGS84 in a standardised format (e.g., WKT). 
    optional: true
dependencies:
glossary:
  - wgs84
  - wkt
references:
changes:
history:
  - SAR 1.6.7
