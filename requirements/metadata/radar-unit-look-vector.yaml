id: rulvec
title: Radar Unit Look Vector
description: 
requirements:
  threshold:
    description: |-
      3-D components radar unit look vector, specified at centre of scene, in an Earth-Centred Earth-Fixed (ECEF) coordinate system (also called Earth Centred Rotating - ECR) is provided.
      It consists of unit vectors from antenna to surface pixel (i.e., positive Z component).
      
      Only required if the corresponding per-pixel metadata [@image] is **not** provided.
dependencies:
  image:
    - per-pixel/radar-unit-look-vector-grid-gslc
    - per-pixel/radar-unit-look-vector-grid-insar
glossary:
  - ecef
  - ecr
references:
changes:
history:
  - SAR 1.7.13
