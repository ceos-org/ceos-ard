id: time-sar
title: Data Collection Time
description:
requirements:
  threshold:
    description: |-
      Number of source data acquisitions of the data collection is identified.
      The start and stop UTC time of data collection is identified in the metadata, expressed in date/time.
      In the case of composite or mosaic products, the dates/times of the first and last data takes is provided with the product.
  goal:
    description: As threshold, but using ISO 8601 time format.
    optional: true
glossary:
  - utc
references:
  - iso8601_1_2019
changes:
history:
  - SAR 1.5
remarks: |-
  todo: The number of source data acquisitions has nothing to do with the time requirements, should be separate.
