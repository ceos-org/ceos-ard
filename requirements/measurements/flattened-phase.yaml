id: flapha
title: Flattened Phase
description: |-
  **Usage:** Alternative to GSLC product for NRB and POL products
requirements:
  goal:
    description: |-
      The Flattened Phase is the interferometric phase for which the topographic phase contribution is removed.
      It is derived from the range-Doppler SLC product using a DEM and the orbital state vectors with respect to a reference orbit (see annex "@title:sections/annexes/sar-topographic-phase-removal" in the applicable PFS).
      The use of the Flattened Phase with the NRB or POL intensity ([@rcm]) provides the GSLC equivalent, as follows:  
  
      $$
      \text{GSLC} = \sqrt{NRB} \times \exp(j \cdot \text{FlattenPhase})
      $$
      
      File format specifications/contents provided in metadata:
  
      - Measurement Type (Flattened Phase)
      - Reference Polarization (HH/HV/VV/VH)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
  
      In case of polarimetric data, indicate the reference polarization. 
    optional: true
dependencies:
sections:
  rcm: requirement-categories/radiometrically-corrected-measurements
