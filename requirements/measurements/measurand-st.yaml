id: measur-st
title: Measurand
description: 
requirements:
  threshold:
    description: |-
      Pixel values are a measurement of the Surface Temperature expressed in kelvin.
    notes:
      - See [@bands]
  goal:
    description: |-
      Surface temperature measurements are SI traceable (see also [@traceability]).
    optional: true
dependencies:  
  bands: metadata/spectral-bands
  traceability: metadata/traceability-st
glossary:
  - si
references:
changes: 
  - date: 2026-07-15
    author: Harvey Jones
    level: patch
    change: |-
      Updated Note in Threshold description and specified requirement in General Metadata that the Goal requirement refers to (traceability)
    reason: 1.10 (spectral bands) would determine the layer height for a microwave SST measurement, therefore allowing a user to infer their definition of surface temperature.
history:
  - ST 3.1
