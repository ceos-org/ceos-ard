id: backsca-nrb
title: Backscatter Measurements (NRB)
description: 
requirements:
  threshold: 
    description: |-
      “Terrain-flattened” Radiometrically Terrain Corrected (RTC) Gamma-Nought backscatter coefficient ($\gamma^0_T$) is provided for each polarization.
  
      File format specifications/contents provided in metadata:
  
      - Measurement Type (Gamma-Nought)
      - Backscatter Expression Convention (linear amplitude, or linear power \[see notes])
      - Polarization (HH, HV, VV, VH)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - Transformation to the logarithm decibel scale is not required or desired as this step can be easily completed by the user if necessary.
dependencies:
glossary:
  - nrb
  - rtc
references:
changes:
history:
  - SAR 3.1
