id: gasiri
title: Gamma-to-Sigma Ratio Image
description: 
requirements:
  goal:
    description: |-
      Ratio of the integrated area in the Gamma projection over the integrated area 
      in the Sigma projection (ground). Multiplying RTC $\gamma^0_T$ by this ratio results in an 
      estimate of RTC $\sigma^0_T$.
  
      File format specifications/contents provided in metadata:
  
      - Sample Type (Ratio)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file can be provided as a URL address of that unique metadata file.
    optional: true
dependencies:
glossary:
  - rtc
  - url
references:
changes:
history:
  - SAR 2.7
