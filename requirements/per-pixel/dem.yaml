id: pidem
title: Per-Pixel DEM
description: 
requirements:
  goal:
    description: |-
      Provide DEM or DSM as used during the geometric and radiometric processing of the SAR data, resampled to an exact geometric match in extent and resolution with the CEOS-ARD SAR image product.
  
      File format specifications/contents provided in metadata:
  
      - Sample Type (Height)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file can be provided as a URL address of that unique metadata file.
    optional: true
dependencies:
glossary:
  - ceos-ard
  - sar
  - dem
  - dsm
  - url
references:
changes:
history:
  - SAR 2.9
remarks: |-
  - Remove "Per-Pixel" from the title, it's inconsistent with other requirements.
  - todo: Remove mention of CEOS-ARD and SAR to be reusable outside of CEOS.
