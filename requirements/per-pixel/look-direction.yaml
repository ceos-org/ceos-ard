id: lookdiri
title: Look Direction Image
description: 
requirements:
  goal:
    description: |-
      Look Direction Image is provided.
      It represents the planar angle between north and each range direction. 
  
      File format specifications/contents provided in metadata:
  
      - Sample Type (Angle)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file can be provided as a URL address of that unique metadata file.
    optional: true
dependencies:
glossary:
  - url
references:
changes:
history:
  - SAR 2.11
