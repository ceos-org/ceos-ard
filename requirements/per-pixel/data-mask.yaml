id: damaski
title: Data Mask Image
description: 
requirements:
  threshold:
    description: |-
      Mask image indicating:
  
      - Valid data
      - Invalid data
      - No data
  
      File format specifications/contents provided in metadata:
  
      - Sample Type (Mask)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, …)
      - Bits per Sample
      - Byte Order
      - Bit Value Representation
    notes:
      - All bit value representations included in the Data Mask Image should be indicated in the metadata.
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file can be provided as a URL address of that unique metadata file.
  goal:
    description: |-
      As threshold, including additional bit value representations, e.g.:
  
      - Layover (masked as invalid data in threshold)
      - Radar shadow (masked as invalid data in threshold)
      - Ocean water
      - Land (recommended for ORB)
      - RTC applied (e.g., for maritime scenes with land samples for which RTC has been applied)
      - DEM gap filling (i.e., interpolated DEM over gaps)
    optional: true
dependencies:
glossary:
  - ceos-ard
  - orb
  - rtc
  - dem
  - url
references:
changes:
history:
  - SAR 2.2
remarks: |-
  todo: Land recommendation for ORB shows up in non-ORB PFS.
