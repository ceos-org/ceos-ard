id: piscata
title: Scattering Area Image
description: |-
  **Usage:** Recommended for scenes that include land areas.
requirements:
  goal:
    description: |-
      DEM-based scattering area image used for Gamma-Nought terrain normalisation is provided.
      This quantifies the local scattering area used to normalise for radiometric distortions induced by terrain to the measured $\beta^0$ backscatter.
      The terrain-flattened $\gamma^0_T$ is best understood as $\beta^0$ divided by the local scattering area.
  
      File format specifications/contents provided in metadata:
      
      - Sample Type (Scattering Area)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Int, Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file could be provided as a URL address of that unique metadata file.
      - Required for products such as NRB and POL if they are to be used as an input to production of composite backscatter (CB) when weighted averages based on the areas are used to generate composite backscatter.
    optional: true
dependencies:
glossary:
  - ceos-ard
  - url
  - nrb
  - pol
  - cb
references:
changes:
history:
  - SAR 2.3
