id: slarassi-gslc
title: Slant Range Sensor to Surface Image
description: 
requirements:
  goal:
    description: |-
      Slant range distance from the sensor to the surface, specified at each pixel in an Earth-Centred Earth-Fixed (ECEF) coordinate system (also called Earth Centred Rotating – ECR) is provided.
  
      File format specifications/contents provided in metadata:
  
      - Sample Type (Length)
      - Data Format (GeoTIFF, HDF5, NetCDF, …)
      - Data Type (Float, …)
      - Bits per Sample
      - Byte Order
    notes:
      - For CEOS-ARD products created from repeat-pass acquisitions, with narrow orbital tube radius, a single static per pixel metadata file can be provided as a URL address of that unique metadata file.
    optional: true
dependencies:
glossary:
  - ecef
  - ecr
  - url
references:
changes:
history:
  - SAR 2.13
